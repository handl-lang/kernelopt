# bupha.toml — committed CI manifest for handl-lang/kernelopt.
#
# Runner is this repo's ci.sh (uv sync + pytest). Merge the [[repos]] entry
# into the shared watcher (~/.config/bupha/bupha.toml) or run:
# bupha watch --config bupha.toml

[[repos]]
name = "handl-lang/kernelopt"
dir = "~/GitHub/handl-lang/kernelopt"
branch = "refs/heads/main"
  [repos.runner]
  kind = "script"
  cmd = "bash ci.sh"
  cancel_running = true

[status]
kind = "github"
context = "ci/bupha"
