[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlopt-kernel"
version = "0.1.0dev"
description = "kernelopt: the codegen domain for the mlopt game layer — codegen law bank, KernelSink, kernel board, and the ``kernel`` play domain.  Split out of handl-lang/graphopt (plan 0032 phase 4)."
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "mlopt-core",
    "mlopt-discovery",
    "gamekit",
    "benchkit",
    "lib-kernel-ir",
    "torch>=2.0",
]

[project.optional-dependencies]
# The hand-Triton field baseline (``bench.limits.triton``) — needs a
# CUDA host to actually run; declines honestly without one.
triton = ["triton>=3.0"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    "ty>=0.0.84",
]
# Measurement probes: ``bench/drivers/probes/kernel_vocab_probe.py``
# lifts the retnet carrier through ``mlopt_carriers.om`` — opt-in so
# the default env stays light; ``uv sync --group probes`` to run it.
probes = [
    "mlopt-carriers",
]

[tool.setuptools.packages.find]
where = ["src"]

# --- substrate deps: git on the split repos ------------------
# plan 0032 phase 4: eqsat (substrate) / gamekit (game layer) /
# graphopt (domain) are separate repos now.
# kernelopt consumes the substrate as pinned git deps on per-package
# subdirectories of handl-lang/graphopt — the phase-4 seam.
# Distribution is git-URL-at-tag: deps pin the ``v0.1.0`` tags on
# eqsat/gamekit/graphopt — bump deliberately on releases.
# See graphopt/docs/reports/git_url_distribution.md.
[tool.uv.sources]
mlopt-core = { git = "https://github.com/handl-lang/eqsat.git", subdirectory = "packages/mlopt-core", tag = "v0.1.6" }
mlopt-dtypes = { git = "https://github.com/handl-lang/eqsat.git", subdirectory = "packages/mlopt-dtypes", tag = "v0.1.6" }
mlopt-torch = { git = "https://github.com/handl-lang/graphopt.git", subdirectory = "packages/mlopt-torch", tag = "v0.1.11" }
mlopt-orchestrator = { git = "https://github.com/handl-lang/eqsat.git", subdirectory = "packages/mlopt-orchestrator", tag = "v0.1.6" }
mlopt-carriers = { git = "https://github.com/handl-lang/graphopt.git", subdirectory = "packages/mlopt-carriers", tag = "v0.1.11" }
gamekit = { git = "https://github.com/handl-lang/gamekit.git", subdirectory = "packages/gamekit", tag = "v0.1.7" }
benchkit = { git = "https://github.com/handl-lang/gamekit.git", subdirectory = "packages/benchkit", tag = "v0.1.7" }
mlopt-discovery = { git = "https://github.com/handl-lang/graphopt.git", subdirectory = "packages/mlopt-discovery", tag = "v0.1.11" }
discoverykit = { git = "https://github.com/handl-lang/discoverykit.git", subdirectory = "packages/discoverykit", tag = "v0.1.10" }
lib-kernel-ir = { git = "https://github.com/handl-lang/lib-kernel-ir.git", tag = "v0.1.1" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# lib-kernel-ir is a declared git dep (tag v0.1.1); the extra
# ``../lib-kernel-ir/src`` pythonpath keeps dev worktrees resolving the
# sibling checkout ahead of the installed wheel.
pythonpath = ["src", "../lib-kernel-ir/src"]

[tool.ty.environment]
python-version = "3.13"
# ../lib-kernel-ir/src mirrors the pytest pythonpath entry — the sibling
# checkout lib_kernel_ir is read from in dev worktrees.
extra-paths = ["src", "../lib-kernel-ir/src"]

[tool.ty.src]
include = ["src"]

[tool.ty.terminal]
error-on-warning = false

[tool.ruff]
target-version = "py311"
line-length = 72

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = [
    "E501",     # line length — math/notation lines exceed 72 legitimately
    "B008",     # function-call in default arg — used for cost-fn defaults
    "SIM108",   # ternary suggestion — if/else often clearer here
]

# The docstring gate applies to shipped code only: tests and bench are
# example/measurement code, not a public API surface.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"bench/**" = ["D"]
